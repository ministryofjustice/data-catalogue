datahub-gms:
  extraEnvs:
    # Override elasticsearch.bulkProcessor.requestsLimit
    # (default: 500)
    - name: ES_BULK_REQUESTS_LIMIT
      value: "250"
    - name: ES_BULK_FLUSH_PERIOD
      value: "15"

global:
  datahub_analytics_enabled: false
  # Dev runs ahead of preprod/prod while the v1.7 upgrade is tested here.
  # Needs helm chart 1.1.x (see deploy-dev.yml). Move to values-base.yaml once
  # preprod/prod are upgraded too.
  datahub:
    version: v1.7.0.1
    managed_ingestion:
      enabled: true
      defaultCliVersion: "1.7.0.9"
  elasticsearch:
    metadataChangeLog:
      hooks:
        ingestionScheduler:
          enabled: false
    index:
      settingsOverrides: '{"graph_service_v1":{"number_of_shards":"1"},"system_metadata_service_v1":{"number_of_shards":"1"}}'
      entitySettingsOverrides: '{"dataset":{"number_of_shards":"1"},"usage_event":{"number_of_shards":"1","number_of_replicas":"0"}}'
  kafka:
    metadataChangeLog:
      hooks:
        ingestionScheduler:
          enabled: false
