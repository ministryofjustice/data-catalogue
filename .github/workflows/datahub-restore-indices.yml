name: DataHub Restore Indices

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - preprod
          - prod
      DATAHUB_HELM_VERSION:
        description: "DataHub helm chart version"
        required: true
        default: "1.0.3"
        type: string
      BATCH_SIZE:
        description: "Restore-indices batch size"
        required: true
        default: "1000"
        type: string
      BATCH_DELAY_MS:
        description: "Delay between restore batches in ms"
        required: true
        default: "500"
        type: string
      NUM_THREADS:
        description: "Number of restore worker threads"
        required: true
        default: "3"
        type: string
      URN_BASED_PAGINATION:
        description: "Use key-based pagination"
        required: true
        default: true
        type: boolean
      CLEAN:
        description: "Wipe all search/graph indices before restoring (full rebuild from Postgres) - only for suspected stuck/orphaned entities a normal restore won't fix. Causes a full search outage until the rebuild completes."
        required: true
        default: false
        type: boolean

jobs:
  run-restore-indices:
    name: Run restore-indices job
    environment: ${{ inputs.ENVIRONMENT }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_NAME: datahub
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Create cert certificate-authority
        shell: bash
        run: echo "${{ secrets.KUBE_CERT }}" > ca.crt

      - name: Authenticate to the cluster
        shell: bash
        env:
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          kubectl config set-cluster "${KUBE_CLUSTER}" --certificate-authority=ca.crt --server="https://${KUBE_CLUSTER}"
          kubectl config set-credentials deploy-user --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context "${KUBE_CLUSTER}" --cluster="${KUBE_CLUSTER}" --user=deploy-user --namespace="${KUBE_NAMESPACE}"
          kubectl config use-context "${KUBE_CLUSTER}"

      - name: Add helm repo
        shell: bash
        run: helm repo add datahub https://helm.datahubproject.io/

      - name: Update helm repo
        shell: bash
        run: helm repo update datahub

      - name: Apply restore-indices helm values
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          CHART_VERSION: ${{ inputs.DATAHUB_HELM_VERSION }}
          BATCH_SIZE: ${{ inputs.BATCH_SIZE }}
          BATCH_DELAY_MS: ${{ inputs.BATCH_DELAY_MS }}
          NUM_THREADS: ${{ inputs.NUM_THREADS }}
          URN_BASED_PAGINATION: ${{ inputs.URN_BASED_PAGINATION }}
          CLEAN: ${{ inputs.CLEAN }}
        # The CronJob template reads its args from
        # datahubUpgrade.restoreIndices.image.args, a plain string list (not
        # the dict-shaped datahubUpgrade.restoreIndices.args a previous
        # version of this step was setting - those keys were never read by
        # the template, so BATCH_SIZE/BATCH_DELAY_MS/NUM_THREADS/
        # URN_BASED_PAGINATION never actually took effect). Rebuilding the
        # whole list here and passing it with --set-json is what the
        # template actually consumes.
        #
        # "clean" is deliberately left out of the base chart args (see
        # values-base.yaml) since it wipes every search/graph index before
        # rebuilding - appended here only when CLEAN=true is explicitly
        # requested.
        run: |
          ARGS=$(jq -nc \
            --arg batchSize "$BATCH_SIZE" \
            --arg batchDelayMs "$BATCH_DELAY_MS" \
            --arg numThreads "$NUM_THREADS" \
            --arg urnBasedPagination "$URN_BASED_PAGINATION" \
            --argjson clean "$CLEAN" \
            '["-u", "RestoreIndices",
              "-a", ("batchSize=" + $batchSize),
              "-a", ("batchDelayMs=" + $batchDelayMs),
              "-a", ("urnBasedPagination=" + $urnBasedPagination),
              "-a", ("numThreads=" + $numThreads)]
             + (if $clean then ["-a", "clean"] else [] end)')

          helm upgrade \
            --install ${RELEASE_NAME} datahub/datahub \
            --version "${CHART_VERSION}" \
            --namespace "${KUBE_NAMESPACE}" \
            --reuse-values \
            --set-json datahubUpgrade.restoreIndices.image.args="${ARGS}"

      - name: re-apply GMS v1.6.0 workarounds
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        # The helm upgrade above reconciles the whole datahub release,
        # including GMS's Deployment - since the v1.6.0 topic-split/
        # max-poll-records fix (see deploy-workflow.yml) is applied via
        # `kubectl set env` rather than a Helm value, that upgrade silently
        # wipes both settings back to the chart's defaults. A GMS pod already
        # running keeps working on its old in-memory config until something
        # next recreates it, so this can sit unnoticed until a later restart
        # (rollout, node move, OOM, ...) exposes it - as happened during this
        # step's own absence, when a routine restart rolled in the reverted
        # spec and reintroduced the dual-topic crash. Re-applying here keeps
        # this workflow's own helm upgrade from ever leaving that regression
        # latent. Remove once DataHub ships fixes upstream for both issues
        # (see deploy-workflow.yml for the full explanation of each).
        run: |
          kubectl set env deployment/datahub-datahub-gms -n ${KUBE_NAMESPACE} \
            METADATA_CHANGE_LOG_TIMESERIES_TOPIC_NAME=zz_disabled_timeseries_mae_split_workaround \
            SPRING_KAFKA_PROPERTIES_MAX_POLL_RECORDS=25

      - name: Trigger one-off restore-indices job from cronjob
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          CRONJOB_NAME=$(kubectl get cronjobs -n "${KUBE_NAMESPACE}" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep 'restore-indices' | head -1)
          if [[ -z "${CRONJOB_NAME}" ]]; then
            echo "No restore-indices cronjob found in namespace ${KUBE_NAMESPACE}." >&2
            exit 1
          fi

          JOB_NAME="restore-indices-manual-$(date +%s)"
          kubectl create job --from=cronjob/${CRONJOB_NAME} "${JOB_NAME}" -n "${KUBE_NAMESPACE}"
          echo "JOB_NAME=${JOB_NAME}" >> "$GITHUB_ENV"

      - name: Wait for restore-indices job completion
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          JOB_NAME: ${{ env.JOB_NAME }}
        run: |
          kubectl wait --for=condition=complete --timeout=2h job/${JOB_NAME} -n "${KUBE_NAMESPACE}"

      - name: Print restore-indices job logs
        if: always()
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          JOB_NAME: ${{ env.JOB_NAME }}
        run: |
          POD_NAME=$(kubectl get pods -n "${KUBE_NAMESPACE}" -l job-name="${JOB_NAME}" -o jsonpath='{.items[0].metadata.name}')
          if [[ -n "${POD_NAME}" ]]; then
            kubectl logs "${POD_NAME}" -n "${KUBE_NAMESPACE}" --all-containers=true
          fi