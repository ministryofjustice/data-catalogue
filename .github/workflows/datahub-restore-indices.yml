name: DataHub Restore Indices

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - preprod
          - prod
      BATCH_SIZE:
        description: "Restore-indices batch size"
        required: true
        default: "1000"
        type: string
      BATCH_DELAY_MS:
        description: "Delay between restore batches in ms"
        required: true
        default: "500"
        type: string
      NUM_THREADS:
        description: "Number of restore worker threads"
        required: true
        default: "3"
        type: string
      URN_BASED_PAGINATION:
        description: "Use key-based pagination"
        required: true
        default: true
        type: boolean
      CLEAN:
        description: "Wipe all search/graph indices before restoring (full rebuild from Postgres) - only for suspected stuck/orphaned entities a normal restore won't fix. Causes a full search outage until the rebuild completes."
        required: true
        default: false
        type: boolean

jobs:
  run-restore-indices:
    name: Run restore-indices job
    environment: ${{ inputs.ENVIRONMENT }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Create cert certificate-authority
        shell: bash
        run: echo "${{ secrets.KUBE_CERT }}" > ca.crt

      - name: Authenticate to the cluster
        shell: bash
        env:
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          kubectl config set-cluster "${KUBE_CLUSTER}" --certificate-authority=ca.crt --server="https://${KUBE_CLUSTER}"
          kubectl config set-credentials deploy-user --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context "${KUBE_CLUSTER}" --cluster="${KUBE_CLUSTER}" --user=deploy-user --namespace="${KUBE_NAMESPACE}"
          kubectl config use-context "${KUBE_CLUSTER}"

      - name: Build restore-indices container args
        id: args
        shell: bash
        env:
          BATCH_SIZE: ${{ inputs.BATCH_SIZE }}
          BATCH_DELAY_MS: ${{ inputs.BATCH_DELAY_MS }}
          NUM_THREADS: ${{ inputs.NUM_THREADS }}
          URN_BASED_PAGINATION: ${{ inputs.URN_BASED_PAGINATION }}
          CLEAN: ${{ inputs.CLEAN }}
        # Full arg list for the `datahub-upgrade` container, rebuilt from the
        # workflow inputs (the CronJob's baked-in
        # datahubUpgrade.restoreIndices.image.args from values-base.yaml is
        # replaced wholesale on the one-off Job below, not merged).
        #
        # "clean" is appended only when CLEAN=true is explicitly requested -
        # it truncates every search/graph index to zero before rebuilding
        # from Postgres (full search outage until it finishes) rather than
        # filling gaps on top of the existing indices.
        run: |
          set -euo pipefail
          ARGS=$(jq -nc \
            --arg batchSize "$BATCH_SIZE" \
            --arg batchDelayMs "$BATCH_DELAY_MS" \
            --arg numThreads "$NUM_THREADS" \
            --arg urnBasedPagination "$URN_BASED_PAGINATION" \
            --argjson clean "$CLEAN" \
            '["-u", "RestoreIndices",
              "-a", ("batchSize=" + $batchSize),
              "-a", ("batchDelayMs=" + $batchDelayMs),
              "-a", ("urnBasedPagination=" + $urnBasedPagination),
              "-a", ("numThreads=" + $numThreads)]
             + (if $clean then ["-a", "clean"] else [] end)')
          echo "args_json=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "Restore-indices container args: ${ARGS}"

      - name: Trigger one-off restore-indices job from cronjob
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          ARGS_JSON: ${{ steps.args.outputs.args_json }}
        # This used to `helm upgrade --install` the whole datahub release
        # just to bake the args above into the restore-indices CronJob, then
        # spawn a Job from it. That upgrade re-ran DataHub's pre/post-upgrade
        # hook jobs (elasticsearch-setup, system-update, nocode migration)
        # and waited on them with Helm's 5-minute default timeout, which
        # reliably times out on prod ("post-upgrade hooks failed: timed out
        # waiting for the condition"). A timed-out upgrade left the release
        # half-reconciled and, because the failure skipped the rest of this
        # workflow, also left the GMS v1.6.0 `kubectl set env` workarounds
        # (owned by deploy-workflow.yml) stripped back to chart defaults -
        # a latent dual-topic crash waiting for the next GMS restart.
        #
        # The helm upgrade was only ever a vehicle for setting CronJob args,
        # so we now skip Helm entirely: render the Job straight from the
        # CronJob's jobTemplate and override just the restore-indices
        # container's args. Nothing else in the release is touched.
        run: |
          set -euo pipefail

          CRONJOB_NAME=$(kubectl get cronjobs -n "${KUBE_NAMESPACE}" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
            | grep 'restore-indices' | head -1)
          if [[ -z "${CRONJOB_NAME}" ]]; then
            echo "No restore-indices cronjob found in namespace ${KUBE_NAMESPACE}." >&2
            exit 1
          fi
          echo "Using cronjob: ${CRONJOB_NAME}"

          JOB_NAME="restore-indices-manual-$(date +%s)"

          kubectl create job --from=cronjob/"${CRONJOB_NAME}" "${JOB_NAME}" \
            -n "${KUBE_NAMESPACE}" --dry-run=client -o json \
            | jq --argjson args "${ARGS_JSON}" \
                '.spec.template.spec.containers[0].args = $args' \
            | kubectl apply -n "${KUBE_NAMESPACE}" -f -

          echo "JOB_NAME=${JOB_NAME}" >> "$GITHUB_ENV"

          echo "Effective container args on ${JOB_NAME}:"
          kubectl get job "${JOB_NAME}" -n "${KUBE_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].args}'
          echo

      - name: Wait for restore-indices job completion
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          JOB_NAME: ${{ env.JOB_NAME }}
        # Poll for either terminal condition rather than `kubectl wait
        # --for=condition=complete`, which cannot also detect a failed Job
        # and would just burn the full timeout on failure.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 7200 ))
          while true; do
            complete=$(kubectl get job "${JOB_NAME}" -n "${KUBE_NAMESPACE}" \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            failed=$(kubectl get job "${JOB_NAME}" -n "${KUBE_NAMESPACE}" \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
            if [[ "${complete}" == "True" ]]; then
              echo "restore-indices job completed."
              break
            fi
            if [[ "${failed}" == "True" ]]; then
              echo "restore-indices job failed." >&2
              exit 1
            fi
            if (( $(date +%s) > deadline )); then
              echo "Timed out waiting for restore-indices job after 2h." >&2
              exit 1
            fi
            sleep 20
          done

      - name: Print restore-indices job logs
        if: always()
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          JOB_NAME: ${{ env.JOB_NAME }}
        run: |
          if [[ -z "${JOB_NAME:-}" ]]; then
            echo "No job was created; nothing to log."
            exit 0
          fi
          kubectl logs -n "${KUBE_NAMESPACE}" "job/${JOB_NAME}" \
            --all-containers=true --tail=-1 --prefix=true || true
