name: Deploy

on:
  workflow_call:
    inputs:
      env:
        description: "which environment to deploy to"
        required: true
        type: string
      datahub_helm_version:
        description: "version of the datahub helm chart to use for deploy"
        required: true
        type: string
      datahub_prereqs_helm_version:
        description: "version of the datahub prerequisites helm chart to use for deploy"
        required: true
        type: string
    secrets:
      kube_namespace:
        description: "the kubernetes namespace to deploy to"
        required: true
      kube_cert:
        description: "cert used to verify identity to cluster"
        required: true
      kube_cluster:
        description: "address of the cluster to connect to"
        required: true
      kube_token:
        description: "used to authenticate to the cluster"
        required: true
      postgres_host:
        description: "address of the metadata database, including port"
        required: true
      postgres_client_host:
        description: "address of the metadata database, without port"
        required: true
      postgres_url:
        description: "URI including the scheme designator (prefix) and database name"
        required: true
      postgres_username:
        description: "username for the metadata database"
        required: true
      postgres_password:
        description: "password for the metadata database"
        required: true
      postgres_db_name:
        description: "name of the metadata database"
        required: true
      opensearch_proxy_host:
        description: "domain address to reach opensearch"
        required: true
      azure_client_secret:
        description: "client secret for azure authentication"
        required: true
      limit_whitelist:
        description: "Comma seperated sting of IP addresses to exlude from rate limiting"
        required: true

concurrency:
  group: ${{ inputs.env }}

jobs:
  deploy:
    name: Deploy Helm Chart into Cloud Platform
    environment: ${{ inputs.env }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # This is required for actions/checkout
      id-token: write # This is required for requesting the JWT
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create cert certificate-authority
        id: create-cert-authority
        shell: bash
        run: echo "${{ secrets.kube_cert }}" > ca.crt

      - name: Authenticate to the cluster
        shell: bash
        id: authenticate
        env:
          KUBE_CLUSTER: ${{ secrets.kube_cluster }}
        run: |
          kubectl config set-cluster "${KUBE_CLUSTER}" --certificate-authority=ca.crt --server="https://${KUBE_CLUSTER}"
          kubectl config set-credentials deploy-user --token="${{ secrets.kube_token }}"
          kubectl config set-context "${KUBE_CLUSTER}" --cluster="${KUBE_CLUSTER}" --user=deploy-user --namespace="${{ secrets.kube_namespace }}"
          kubectl config use-context "${KUBE_CLUSTER}"

      - name: Create users-secret if it doesn't exist
        shell: bash
        id: create-users-secret-if-not-exists
        env:
          KUBE_NAMESPACE: ${{ secrets.kube_namespace }}
          RELEASE_NAME: datahub
        run: |
          NS_SECRETS=$(kubectl get secrets -n ${KUBE_NAMESPACE} -o=jsonpath='{range .items..metadata}{.name}{"\n"}{end}')

          USERS_SECRET_NAME=$(echo ${NS_SECRETS} | egrep "${RELEASE_NAME}-users-secret" || exit_code=$?
          if (( exit_code > 1 )) ; then
              exit $exit_code
          fi)

          if [[ -z ${USERS_SECRET_NAME} ]]; then
            echo "users-secret doesn't exist. Creating..."

            USER_PASS=$(openssl rand -base64 12)
            
            cat >/tmp/user.props <<EOL
            // new user.props
            datahub:${USER_PASS}
          EOL
            
            kubectl create secret generic "${RELEASE_NAME}-users-secret" --from-file=/tmp/user.props -n ${KUBE_NAMESPACE} 
          fi

      - name: add helm repo
        shell: bash
        id: add-helm-repo
        continue-on-error: true
        run: |
          helm repo add datahub https://helm.datahubproject.io/

      - name: update helm repos
        shell: bash
        id: update-helm-repo
        continue-on-error: true
        run: |
          helm repo update datahub

      - name: install datahub pre-requisites charts
        shell: bash
        id: upgrade-helm-prereqs
        env:
          CHART_VERSION: ${{ inputs.datahub_prereqs_helm_version }}
        run: |
          helm upgrade \
          --install prerequisites datahub/datahub-prerequisites \
          --version ${CHART_VERSION} \
          --atomic --timeout 5m0s \
          --values helm_deploy/values_prerequisites-base.yaml \
          --namespace ${{ secrets.kube_namespace }}

      - name: set env vars
        shell: bash
        id: set-envs
        env:
          KUBE_NAMESPACE: ${{ secrets.kube_namespace }}
          BASE_HOST: apps.live.cloud-platform.service.justice.gov.uk
          RELEASE_NAME: datahub
          OPENSEARCH_PROXY_HOST: ${{ secrets.OPENSEARCH_PROXY_HOST }}
        run: |-
          echo "BASE_HOST=${BASE_HOST}" >> $GITHUB_ENV 
          echo "APP_SHORT_HOST=${KUBE_NAMESPACE/data-platform-/}.${BASE_HOST}" >> $GITHUB_ENV
          echo "EXT_DNS_ID=${RELEASE_NAME}-datahub-frontend-${{ inputs.env }}-${KUBE_NAMESPACE}-green" >> $GITHUB_ENV
          echo "OPENSEARCH_DOMAIN=$(echo ${OPENSEARCH_PROXY_HOST} | sed -e 's/[.].*$//' -e 's/opensearch-proxy-service-//')" >> $GITHUB_ENV

      - name: create azure k8s secrets
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.kube_namespace }}
          AZURE_CLIENT_ID: ${{ vars.CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TENANT_ID: ${{ vars.TENANT_ID }}
        run: |
          envsubst < helm_deploy/secrets.yaml |
          kubectl -n ${KUBE_NAMESPACE} apply -f -

      - name: Populate limit_whitelist values
        shell: bash
        env:
          LIMIT_WHITELIST: ${{ secrets.limit_whitelist }}
        run: |
          yq eval '.datahub-frontend.ingress.annotations."nginx.ingress.kubernetes.io/limit-whitelist" = strenv(LIMIT_WHITELIST)' -i helm_deploy/values-base.yaml

      - name: install datahub helm charts
        shell: bash
        id: upgrade-helm-datahub
        env:
          APP_SHORT_HOST: ${{ env.APP_SHORT_HOST }}
          CHART_VERSION: ${{ inputs.datahub_helm_version }}
          IRSA_SA: data-catalogue-${{ inputs.env }}
          OPENSEARCH_PROXY_HOST: ${{ secrets.OPENSEARCH_PROXY_HOST }}
          POSTGRES_CLIENT_HOST: ${{ secrets.postgres_client_host }}
          POSTGRES_HOST: ${{ secrets.postgres_host }}
          POSTGRES_URL: ${{ secrets.postgres_url }}
          POSTGRES_USERNAME: ${{ secrets.postgres_username }}
          POSTGRES_PASSWORD: ${{ secrets.postgres_password }}
          POSTGRES_DB_NAME: ${{ secrets.postgres_db_name }}
          RELEASE_NAME: datahub
          FRONTEND_FULLNAME: datahub-frontend-${{ inputs.env }}
        # if many env-specific variables need setting, add --values files after 'base'
        # e.g. `--values helm_deploy/values-${{ inputs.env }}.yaml \`
        run: |
          helm upgrade \
          --install ${RELEASE_NAME} datahub/datahub \
          --version ${CHART_VERSION} \
          --atomic --debug --timeout 600m0s \
          --values helm_deploy/values-base.yaml \
          --values helm_deploy/${{inputs.env}}/values-base.yaml \
          --namespace ${{ secrets.kube_namespace }} \
          --set datahub-frontend.fullnameOverride=${RELEASE_NAME}-${FRONTEND_FULLNAME} \
          --set datahub-frontend.oidcAuthentication.azureTenantId=${{ vars.TENANT_ID }} \
          --set datahub-frontend.oidcAuthentication.clientId=${{ vars.CLIENT_ID }} \
          --set datahub-frontend.ingress.tls[0].hosts[0]=${APP_SHORT_HOST} \
          --set datahub-frontend.ingress.hosts[0].host=${APP_SHORT_HOST} \
          --set datahub-frontend.ingress.annotations.external-dns\\.alpha\\.kubernetes\\.io/set-identifier=${EXT_DNS_ID} \
          --set acryl-datahub-actions.serviceAccount.name=${IRSA_SA} \
          --set global.elasticsearch.host=${OPENSEARCH_PROXY_HOST} \
          --set global.sql.datasource.host=${POSTGRES_HOST} \
          --set global.sql.datasource.hostForpostgresqlClient=${POSTGRES_CLIENT_HOST} \
          --set global.sql.datasource.url=${POSTGRES_URL} \
          --set global.sql.datasource.username=${POSTGRES_USERNAME} \
          --set global.sql.datasource.extraEnvs[0].value=${POSTGRES_DB_NAME}

      - name: apply GMS v1.6.0 workarounds
        # Now applied to every environment this workflow deploys to (dev,
        # preprod, prod - the only three inputs.env ever takes, per
        # deploy-dev.yml/deploy-staged.yml), so no env gate here.
        shell: bash
        id: gms-timeseries-workaround
        env:
          KUBE_NAMESPACE: ${{ secrets.kube_namespace }}
        # Two related v1.6.0 GMS fixes, both applied via `kubectl set env`
        # directly on the live Deployment rather than as Helm values, and
        # both discovered/validated running RestoreIndices against dev:
        #
        # 1. METADATA_CHANGE_LOG_TIMESERIES_TOPIC_NAME - GMS's embedded MAE
        #    consumer crashes on startup (org.apache.avro.
        #    InvalidNumberEncodingException) when subscribed to both
        #    MetadataChangeLog_Versioned_v1 and MetadataChangeLog_Timeseries_v1
        #    at once. Redirecting Timeseries to a placeholder here leaves GMS
        #    handling Versioned only; Timeseries is handled instead by the
        #    standalone consumer deployed in the next step.
        #
        # 2. SPRING_KAFKA_PROPERTIES_MAX_POLL_RECORDS - separately, GMS got
        #    stuck in an infinite rebalance loop during a RestoreIndices
        #    backfill: a batch of expensive-to-process records (dbt sibling-
        #    association lookups) took longer than max.poll.interval.ms
        #    (300000ms default) to get through at the default
        #    max.poll.records=500, so Kafka kept evicting the consumer before
        #    it could commit, and it retried the same batch forever. Reducing
        #    the batch size gives it enough headroom to always commit within
        #    the timeout. 100 initially looked safe (hours with zero timeouts
        #    in dev), but both dev and preprod later hit an even more
        #    expensive batch that still stalled it at 100 - one environment
        #    crash-looped, the other stalled permanently with no active
        #    consumer group members until GMS was restarted. 25 has since run
        #    stable through both environments' full backfill to zero lag.
        #
        # Both are applied via `kubectl set env` rather than a
        # datahub-gms.extraEnvs values entry: appending a second same-named
        # env var relies on "last one wins", which does NOT hold when Helm
        # patches an existing Deployment (confirmed by testing - the key was
        # dropped entirely by the API server's strategic merge patch, causing
        # the upgrade to fail outright). METADATA_CHANGE_LOG_TIMESERIES_TOPIC_NAME
        # also can't be a global.kafka.topics values override, since that
        # value is shared by every component in the release
        # (acryl-datahub-actions, the restore-indices CronJob, the
        # system-update jobs) and redirecting it for all of them risks
        # silently breaking things like RestoreIndices backfilling
        # Timeseries data. `kubectl set env` scopes both changes to GMS
        # alone and replaces the values in place, no duplicate involved.
        #
        # Remove this step once DataHub ships fixes upstream for both issues.
        run: |
          kubectl set env deployment/datahub-datahub-gms -n ${KUBE_NAMESPACE} \
            METADATA_CHANGE_LOG_TIMESERIES_TOPIC_NAME=zz_disabled_timeseries_mae_split_workaround \
            SPRING_KAFKA_PROPERTIES_MAX_POLL_RECORDS=25

      - name: deploy standalone timeseries MAE consumer (v1.6.0 workaround)
        # Must always run alongside the step above, which has redirected GMS
        # off this topic in every environment - without it, GMS would still
        # fight this consumer over the same topic.
        shell: bash
        id: deploy-mae-timeseries-workaround
        env:
          CHART_VERSION: ${{ inputs.datahub_helm_version }}
          OPENSEARCH_PROXY_HOST: ${{ secrets.OPENSEARCH_PROXY_HOST }}
          POSTGRES_HOST: ${{ secrets.postgres_host }}
          POSTGRES_URL: ${{ secrets.postgres_url }}
          POSTGRES_USERNAME: ${{ secrets.postgres_username }}
        # Renders (never installs) the datahub-mae-consumer subchart with
        # standalone-consumer values so we can extract just its
        # Deployment/Service and apply them directly. This works around a
        # v1.6.0 GMS bug (see helm_deploy/mae-consumer-timeseries-values.yaml
        # for the full explanation) that the chart's normal
        # datahub_standalone_consumers_enabled flag can't express, since that
        # flag would also disable GMS's own embedded consumer.
        #
        # Enabling that flag also renders datahub-mce-consumer as a side
        # effect (same shared flag) - `--show-only` filters the output but
        # Helm still evaluates every template first, so the DB --set
        # overrides below are required for a clean render even though the
        # MAE consumer itself never uses them.
        #
        # Remove this step once DataHub ships a fix upstream.
        run: |
          helm template datahub datahub/datahub \
          --version ${CHART_VERSION} \
          --values helm_deploy/values-base.yaml \
          --values helm_deploy/${{inputs.env}}/values-base.yaml \
          --values helm_deploy/mae-consumer-timeseries-values.yaml \
          --namespace ${{ secrets.kube_namespace }} \
          --set global.elasticsearch.host=${OPENSEARCH_PROXY_HOST} \
          --set global.sql.datasource.host=${POSTGRES_HOST} \
          --set global.sql.datasource.url=${POSTGRES_URL} \
          --set global.sql.datasource.username=${POSTGRES_USERNAME} \
          --show-only charts/datahub-mae-consumer/templates/service.yaml \
          --show-only charts/datahub-mae-consumer/templates/deployment.yaml \
          | kubectl apply -n ${{ secrets.kube_namespace }} -f -

      - name: allow CP prometheus scraping
        shell: bash
        id: allow-prom-scrape
        env:
          KUBE_NAMESPACE: ${{ secrets.kube_namespace }}
        run: |
          envsubst < helm_deploy/monitoring/datahub-networkpolicy.yaml | 
            kubectl apply -f - --namespace=${KUBE_NAMESPACE}

      - name: update grafana status dashboard configmap
        if: ${{ inputs.env == 'dev' }}
        shell: bash
        id: update-grafana-status-dashboard
        env:
          KUBE_NAMESPACE: ${{ secrets.kube_namespace }}
          DASHBOARD: "datahub-status-dashboard"
          DASHBOARD_FILE: "datahub-dashboard.json"
        run: |
            kubectl create configmap ${DASHBOARD} \
            --from-file="helm_deploy/monitoring/${DASHBOARD_FILE}" \
            --dry-run \
            --output yaml | 
              kubectl label -f- \
              --dry-run \
              --output yaml \
              --local grafana_dashboard=${DASHBOARD} | 
              kubectl apply -f- \
              --namespace=${KUBE_NAMESPACE}

      - name: update grafana deployment dashboard configmap
        if: ${{ inputs.env == 'dev' }}
        shell: bash
        id: update-grafana-deployment-dashboard
        env:
          KUBE_NAMESPACE: ${{ secrets.kube_namespace }}
          DASHBOARD: "datahub-deployment-dashboard"
          DASHBOARD_FILE: "datahub-deployment-dashboard.json"
        run: |
          DASHBOARD_JSON="helm_deploy/monitoring/${DASHBOARD_FILE}"
          
          jq --arg e ${OPENSEARCH_DOMAIN} '(.templating.list[] | (select(.label == "DomainName").current.text),select(.label == "DomainName").current.value) |= $e' $DASHBOARD_JSON > temp_json.json \
            && mv temp_json.json $DASHBOARD_JSON
          
          kubectl create configmap ${DASHBOARD} \
            --from-file=$DASHBOARD_JSON \
            --dry-run \
            --output yaml | 
              kubectl label -f- \
              --dry-run \
              --output yaml \
              --local grafana_dashboard=${DASHBOARD} | 
              kubectl apply -f- \
              --namespace=${KUBE_NAMESPACE}
